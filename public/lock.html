<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050508;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }

    #particles-js { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      top: 0; 
      left: 0; 
      z-index: 1; 
    }

    #lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .boxy-card {
      width: 380px;
      padding: 36px 30px;
      background: #0d0e12;
      border: 1px solid #23252e;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .boxy-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .boxy-subtitle {
      font-size: 13px;
      color: #8a8d9b;
      margin-bottom: 24px;
      font-weight: 400;
    }

    .boxy-input {
      width: 100%;
      padding: 12px 14px;
      background: #050508;
      border: 1px solid #23252e;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s ease;
    }

    .boxy-input:focus {
      border-color: #4a4e61;
    }

    .boxy-input::placeholder {
      color: #4a4e61;
    }

    .boxy-btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: #23252e;
      border: 1px solid #323543;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .boxy-btn:hover {
      background: #2e313e;
      border-color: #4a4e61;
    }

    #lock-err {
      margin-top: 12px;
      font-size: 12px;
      color: #ff5555;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div id="lock-screen">
    <div class="boxy-card">
      <div class="boxy-title">AUTHENTICATION</div>
      <div class="boxy-subtitle">Enter passphrase to unlock</div>
      <input type="password" id="lock-input" class="boxy-input" placeholder="Password" autofocus onkeydown="if(event.key==='Enter') submitAuth()">
      <button class="boxy-btn" onclick="submitAuth()">UNLOCK</button>
      <div id="lock-err"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 70, density: { enable: true, value_area: 900 } },
        color: { value: '#777777' },
        shape: { type: 'circle' },
        opacity: { value: 0.4, random: false },
        size: { value: 2.5, random: true },
        line_linked: {
          enable: true,
          distance: 140,
          color: '#ffffff',
          opacity: 0.15,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.2, // Slowed down
          direction: 'none',
          random: true,
          straight: false,
          out_mode: 'out',
          bounce: false
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: true, mode: 'grab' }, // Cursor attraction link
          onclick: { enable: true, mode: 'push' },
          resize: true
        },
        modes: {
          grab: { distance: 180, line_linked: { opacity: 0.5 } },
          push: { particles_nb: 3 }
        }
      },
      retina_detect: true
    });

    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitAuth() {
      const inputEl = document.getElementById('lock-input');
      const errEl = document.getElementById('lock-err');
      const val = inputEl.value.trim();

      if (!val) return;

      try {
        const hashedVal = await hashPassword(val);
        const res = await fetch('/auth_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload: hashedVal })
        });

        const data = await res.json();
        if (data.success && data.redirect) {
          window.location.href = data.redirect;
        } else {
          errEl.innerText = data.message || 'Incorrect passphrase.';
          inputEl.value = '';
        }
      } catch (err) {
        errEl.innerText = 'Network connection failed.';
      }
    }
  </script>
</body>
</html>
