
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      position: relative;
    }

    #particles-js { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }

    #lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
    }

    .boxy-card {
      width: 360px;
      padding: 30px;
      background: rgba(20, 20, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      text-align: center;
    }

    .boxy-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .boxy-subtitle {
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .boxy-input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
      text-align: center;
      transition: border 0.2s;
    }

    .boxy-input:focus {
      border-color: rgba(255, 255, 255, 0.7);
    }

    .boxy-btn {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .boxy-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #lock-err {
      margin-top: 12px;
      font-size: 11px;
      color: #ff4444;
      font-family: monospace;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div id="lock-screen">
    <div class="boxy-card">
      <div class="boxy-title">AUTHENTICATION</div>
      <div class="boxy-subtitle">Enter passphrase to unlock</div>
      <input type="password" id="lock-input" class="boxy-input" placeholder="Password" autofocus onkeydown="if(event.key==='Enter') submitAuth()">
      <button class="boxy-btn" onclick="submitAuth()">UNLOCK</button>
      <div id="lock-err"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: '#ffffff' },
        shape: { type: 'circle', stroke: { width: 0, color: '#000000' } },
        opacity: { value: 0.5, random: false },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 6, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
        modes: { repulse: { distance: 100, duration: 0.4 }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });

    async function submitAuth() {
      const inputEl = document.getElementById('lock-input');
      const errEl = document.getElementById('lock-err');
      const val = inputEl.value.trim();

      try {
        const res = await fetch('/auth_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        });
        const data = await res.json();

        if (data.success && data.redirect) {
          window.location.href = data.redirect;
        } else {
          errEl.innerText = data.message || 'Incorrect passphrase.';
          inputEl.value = '';
        }
      } catch (err) {
        errEl.innerText = 'Network connection failed.';
      }
    }
  </script>
</body>
</html>
