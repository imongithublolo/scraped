<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneCompiler Python Embed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/vscode-assets/editor/editor.main.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* OneCompiler Embed Header Toolbar */
    .toolbar { height: 40px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
    .lang-title { font-size: 13px; font-weight: 600; color: #58a6ff; display: flex; align-items: center; gap: 6px; }
    .btn-run { background: #238636; color: #ffffff; border: none; padding: 5px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-run:hover { background: #2ea043; }
    .btn-run:disabled { background: #343942; color: #484f58; cursor: not-allowed; }

    /* Split Screen Container */
    .workspace { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 40px); }
    #editor-container { flex: 1; min-height: 50%; }
    
    /* Console Output Panel */
    .console-panel { height: 35%; background: #090d16; border-top: 1px solid #30363d; display: flex; flex-direction: column; }
    .console-header { background: #161b22; padding: 4px 12px; font-size: 11px; font-weight: bold; color: #8b949e; border-bottom: 1px solid #21262d; text-transform: uppercase; }
    #console-output { flex: 1; padding: 10px 12px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-y: auto; color: #7ee787; }
    #console-output.error { color: #f85149; }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="lang-title">⚡ Python 3 (OneCompiler API)</div>
    <button id="run-btn" class="btn-run" onclick="runOneCompilerCode()">Run</button>
  </div>

  <div class="workspace">
    <div id="editor-container"></div>
    <div class="console-panel">
      <div class="console-header">Output</div>
      <pre id="console-output">Press "Run" to execute python code via OneCompiler backend...</pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script>
    let monacoEditor;

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      monacoEditor = monaco.editor.create(document.getElementById('editor-container'), {
        value: '# OneCompiler Embed Runner\nimport sys\n\nprint("Python version:", sys.version)\nprint("Hello from OneCompiler backend proxy!")',
        language: 'python',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false }
      });
    });

    async function runOneCompilerCode() {
      const runBtn = document.getElementById('run-btn');
      const output = document.getElementById('console-output');
      
      runBtn.disabled = true;
      runBtn.innerText = "Running...";
      output.classList.remove('error');
      output.innerText = "Connecting to OneCompiler execution service...";

      try {
        // Posts directly to your Vercel proxy route: /api/v1/run
        const response = await fetch('/api/v1/run', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: "Python 3",
            title: "Python 3",
            version: "latest",
            language: "python",
            files: [
              {
                name: "main.py",
                content: monacoEditor.getValue()
              }
            ]
          })
        });

        const data = await response.json();

        if (data.stdout || data.stderr || data.exception) {
          if (data.stderr || data.exception) {
            output.classList.add('error');
            output.innerText = data.stderr || data.exception;
          } else {
            output.innerText = data.stdout;
          }
        } else {
          output.classList.add('error');
          output.innerText = JSON.stringify(data, null, 2);
        }
      } catch (err) {
        output.classList.add('error');
        output.innerText = "Proxy Request Failed: " + err.message;
      } finally {
        runBtn.disabled = false;
        runBtn.innerText = "Run";
      }
    }
  </script>
</body>
</html>
