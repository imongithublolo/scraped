        <div id="popup-container" class="full-screen">
            <div id="wallpaper-picker" class="white-background popup high-elevation high-roundness">
                <button id="file-picker-button" class="popup-button button subtle-elevation subtle-roundness">
                    Load File
                </button>
                <div id="wallpaper-hint" class="popup-text">Or drag and drop an image</div>
            </div>

            <div id="shortcut-creator" class="white-background popup high-elevation high-roundness">
                <center><h1>Create Shortcut</h1></center>
                <h2>Shortcut Name</h2>
                <input type="text" data-name="name" class="low-roundness" placeholder="Enter a name for the shortcut" required="">
                <h2>Shortcut Link</h2>
                <input type="url" data-name="url" class="low-roundness" placeholder="https://example.com/page" required="">
                <h2>Custom Icon (Optional)</h2>
                <input type="text" data-name="icon" class="low-roundness" placeholder="Enter a link to an icon">
                <div class="button-container">
                    <button id="shortcut-cancel" class="cancel button low-roundness">Cancel</button>
                    <button id="shortcut-save" class="save button low-roundness" disabled="">Create</button>
                </div>
            </div>

            <div id="shortcut-editor" class="white-background popup high-elevation high-roundness">
                <center><h1>Edit Shortcut</h1></center>
                <h2>Shortcut Name</h2>
                <input type="text" data-name="name" class="low-roundness" placeholder="Enter a name for the shortcut" required="">
                <h2>Shortcut Link</h2>
                <input type="url" data-name="url" class="low-roundness" placeholder="https://example.com/page" required="">
                <h2>Custom Icon</h2>
                <input type="url" data-name="icon" class="low-roundness" placeholder="Enter a link to an icon">
                <div class="white-background popup high-elevation high-roundness confirm-delete">
                    <h2>Are you sure you want to delete this shortcut?</h2>
                    <div class="button-container">
                        <button id="cancel" class="confirm cancel button low-roundness">Cancel</button>
                        <button id="delete" class="confirm delete button low-roundness">Delete</button>
                    </div>
                </div>
                <div class="button-container">
                    <button id="shortcut-delete" class="delete button low-roundness">Delete</button>
                    <button id="shortcut-cancel" class="cancel button low-roundness">Cancel</button>
                    <button id="shortcut-save" class="save button low-roundness" disabled="">Save</button>
                </div>
            </div>
        </div>
